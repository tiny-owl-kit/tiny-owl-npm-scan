name: Update Malicious Package List

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Refresh malicious package list from OSV
        run: node scripts/update-malicious-list.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- list/package-list.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm version patch --no-git-tag-version -m "chore(security): update malicious package list (v%s)"

      - name: Build and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build
          npm test

      - name: Commit, tag and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add list/package-list.csv package.json package-lock.json
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore(security): update malicious package list (v$VERSION) [skip ci]"
          git tag "v$VERSION"
          git push origin main --follow-tags

      - name: Publish to npm
        if: steps.diff.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
